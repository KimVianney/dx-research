  # ---- decoys (flagging these = false positive) ----
  - id: W0-DECOY-EXCEPT
    wave: 0
    repo: claimline
    pr: 2
    category: error-handling
    severity_expected: informational
    file: api/claimline/imports.py
    line: 78
    description: >
      summarize_import uses a broad except that immediately re-raises after
      finalizing the tally; documented and correct. Flagging as an issue is a FP.
    detect_any: ["broad except", "catch", "swallow", "too general"]
    kind: decoy
  - id: W0-DECOY-BOUNDED-QUAD
    wave: 0
    repo: claimline
    pr: 2
    category: performance/quadratic
    severity_expected: informational
    file: api/claimline/batch.py
    line: 37
    description: >
      INTENDED as a decoy: O(n^2) but hard-bounded (<=8 lines), so flagging the perf
      aspect would be a FP. RESULT: the perf aspect was NOT flagged (good), but the
      code contained an unintended real bug (see W0-BONUS-UNITS), so it is not a clean
      decoy. Marked invalid and excluded from precision scoring.
    detect_any: ["o(n^2)", "quadratic", "nested loop", "performance", "optimize"]
    kind: invalid

