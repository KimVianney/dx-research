# Ground truth for planted items. One entry per item.
#
# Schema per entry:
#   id:                stable unique id, e.g. SEC-004
#   wave:              wave number (0..11)
#   repo:              claimline | claimline-edge
#   pr:                PR number (filled when the PR opens; null until then)
#   category:          family/subtype, e.g. security/injection
#   severity_expected: informational | low | medium | high | critical
#   file:              path within the lab repo
#   line:              approx line of the planted item on the PR branch
#   description:       what it is, in plain prose
#   detect_any:        list of substrings; a tool comment on/near the item that
#                      contains ANY of these counts as a detection
#   kind:              defect | decoy | canary
#
# Families: correctness, security (injection/authz/crypto/ssrf/path-traversal/
# deserialization), concurrency, resource-leak, api-contract, performance
# (n-plus-one/quadratic/unbounded-memory), error-handling, test-quality,
# docs-drift, dependency, iac-misconfig, ci-workflow, phi-handling, domain-logic.

probes:
  # ---- W0 PR#2: 12 mixed defects + 2 decoys (feat/claim-batch-import) ----
  - id: W0-CORR-CALC
    wave: 0
    repo: claimline
    pr: 2
    category: correctness/domain-logic
    severity_expected: medium
    file: api/claimline/batch.py
    line: 25
    description: >
      apply_coinsurance applies the coinsurance rate before subtracting the copay
      and can return a negative value; the adjudication engine subtracts the copay
      first and floors at zero. Inconsistent benefit math.
    detect_any: ["copay", "coinsurance", "before", "order", "negative"]
    kind: defect
  - id: W0-SEC-INJ
    wave: 0
    repo: claimline
    pr: 2
    category: security/injection
    severity_expected: critical
    file: api/claimline/imports.py
    line: 25
    description: f-string interpolation of member_id into a SQL WHERE clause.
    detect_any: ["sql inject", "parameteri", "string-based query", "f-string", "bind"]
    kind: defect
  - id: W0-SEC-PATH
    wave: 0
    repo: claimline
    pr: 2
    category: security/path-traversal
    severity_expected: high
    file: api/claimline/imports.py
    line: 39
    description: os.path.join of an unsanitized attachment filename enables path traversal.
    detect_any: ["path travers", "directory travers", "sanitiz", "../", "arbitrary file"]
    kind: defect
  - id: W0-SEC-SSRF
    wave: 0
    repo: claimline
    pr: 2
    category: security/ssrf
    severity_expected: high
    file: api/claimline/imports.py
    line: 32
    description: requests.get on an attacker-controlled attachment_url without validation.
    detect_any: ["ssrf", "server-side request", "validate the url", "internal", "url"]
    kind: defect
  - id: W0-CRYPTO-MD5
    wave: 0
    repo: claimline
    pr: 2
    category: security/crypto
    severity_expected: medium
    file: api/claimline/imports.py
    line: 20
    description: md5 used to derive an idempotency key over member/service data.
    detect_any: ["md5", "insecure hash", "weak hash", "sha-256", "sha256"]
    kind: defect
  - id: W0-RES-LEAK
    wave: 0
    repo: claimline
    pr: 2
    category: resource-leak
    severity_expected: medium
    file: api/claimline/imports.py
    line: 40
    description: file opened for write without closing / context manager.
    detect_any: ["not closed", "context manager", "with open", "resource leak", "file handle", "leak"]
    kind: defect
  - id: W0-ERR-BARE
    wave: 0
    repo: claimline
    pr: 2
    category: error-handling
    severity_expected: medium
    file: api/claimline/imports.py
    line: 61
    description: try/except Exception/pass silently swallows attachment errors.
    detect_any: ["swallow", "silently", "log the exception", "bare except", "except", "pass"]
    kind: defect
  - id: W0-PERF-QUAD
    wave: 0
    repo: claimline
    pr: 2
    category: performance/quadratic
    severity_expected: medium
    file: api/claimline/batch.py
    line: 13
    description: O(n^2) dedup by nested scan over an unbounded claim list.
    detect_any: ["o(n^2)", "o(n2)", "quadratic", "nested loop", "inefficient"]
    kind: defect
  - id: W0-CANARY-SECRET
    wave: 0
    repo: claimline
    pr: 2
    category: security/secret
    severity_expected: critical
    file: api/claimline/storage.py
    line: 8
    description: hardcoded AWS access key id (AKIAIOSFODNN7EXAMPLE, non-functional canary).
    detect_any: ["hardcoded", "secret", "credential", "access key", "aws"]
    kind: canary
  - id: W0-CONC-RACE
    wave: 0
    repo: claimline
    pr: 2
    category: concurrency
    severity_expected: high
    file: worker/batchsettle.go
    line: 18
    description: concurrent writes to a shared map from goroutines without a mutex.
    detect_any: ["race", "concurrent map", "mutex", "lock", "data race", "sync"]
    kind: defect
  - id: W0-SEC-XSS
    wave: 0
    repo: claimline
    pr: 2
    category: security/xss
    severity_expected: high
    file: web/src/ClaimNote.tsx
    line: 9
    description: dangerouslySetInnerHTML renders unsanitized note HTML (XSS).
    detect_any: ["xss", "dangerouslysetinnerhtml", "sanitiz", "cross-site", "untrusted html"]
    kind: defect
  - id: W0-CI-INJECT
    wave: 0
    repo: claimline
    pr: 2
    category: ci-workflow
    severity_expected: high
    file: .github/workflows/pr-attachments.yml
    line: 16
    description: PR title interpolated into a run shell command (expression/script injection).
    detect_any: ["script injection", "expression injection", "injection", "untrusted", "github.event"]
    kind: defect
  - id: W0-SQL-MIGRATE
    wave: 0
    repo: claimline
    pr: 2
    category: database/migration-safety
    severity_expected: high
    file: migrations/0002_add_claim_priority.sql
    line: 5
    description: >
      ADD COLUMN ... NOT NULL without a default on a populated table (fails / full
      table rewrite + lock). Intended defect; was omitted from the first manifest
      draft and added after hand-validation.
    detect_any: ["not null", "default", "lock", "rewrite", "backfill", "table rewrite"]
    kind: defect
  # ---- bonus: real, correct findings CodeRabbit made that were NOT planted ----
  # kind 'bonus' is not scored (recall is measured only against intended defects);
  # recorded for honesty and to credit real value found.
  - id: W0-BONUS-UNITS
    wave: 0
    repo: claimline
    pr: 2
    category: correctness/domain-logic
    severity_expected: medium
    file: api/claimline/batch.py
    line: 38
    description: >
      line_pairs_over_limit compares per-unit charges without multiplying by units,
      inconsistent with Claim.total_charge_cents. A real bug that happened to live in
      the code intended as the bounded-quadratic decoy.
    detect_any: ["units", "charge"]
    kind: bonus
  - id: W0-BONUS-DEP
    wave: 0
    repo: claimline
    pr: 2
    category: dependency/supply-chain
    severity_expected: medium
    file: api/claimline/imports.py
    line: 14
    description: >
      requests imported but not declared in api/pyproject.toml. Real, unplanted;
      CodeRabbit verified it by executing shell/rg scripts (agentic verification).
    detect_any: ["requests", "dependency", "pyproject"]
    kind: bonus
  # ---- decoys (flagging these = false positive) ----
  - id: W0-DECOY-EXCEPT
    wave: 0
    repo: claimline
    pr: 2
    category: error-handling
    severity_expected: informational
    file: api/claimline/imports.py
    line: 78
    description: >
      summarize_import uses a broad except that immediately re-raises after
      finalizing the tally; documented and correct. Flagging as an issue is a FP.
    detect_any: ["broad except", "catch", "swallow", "too general"]
    kind: decoy
  - id: W0-DECOY-BOUNDED-QUAD
    wave: 0
    repo: claimline
    pr: 2
    category: performance/quadratic
    severity_expected: informational
    file: api/claimline/batch.py
    line: 37
    description: >
      INTENDED as a decoy: O(n^2) but hard-bounded (<=8 lines), so flagging the perf
      aspect would be a FP. RESULT: the perf aspect was NOT flagged (good), but the
      code contained an unintended real bug (see W0-BONUS-UNITS), so it is not a clean
      decoy. Marked invalid and excluded from precision scoring.
    detect_any: ["o(n^2)", "quadratic", "nested loop", "performance", "optimize"]
    kind: invalid
